# Codemagic CI untuk Avoera POS (Android).
#
# Dua workflow, KEDUANYA manual (tidak ada trigger otomatis) supaya tidak ada
# build yang jalan tanpa disadari:
#   - android-release : flutter pub get + flutter build apk --release
#   - android-debug   : flutter pub get + flutter build apk --debug
#
# Project Flutter ada di ROOT repo ini (bukan subfolder mobile/),
# jadi artifacts ada di build/app/outputs/flutter-apk/*.apk.
#
# Mesin mac_mini_m2 mengikuti pola WeLaundry: build memakai kuota gratis
# Codemagic 500 menit macOS/bulan.
#
# Keystore rilis TETAP (sejak 2026-11-15): referensi avoera_release,
# diunggah sekali ke Codemagic (Team settings > codemagic.yaml settings
# > Code signing identities > Android keystores). build.gradle.kts
# membaca CM_KEYSTORE_* sehingga SEMUA build bertanda tangan sama ->
# update berikutnya bisa langsung ditimpa TANPA uninstall. Sebelumnya
# APK memakai kunci debug mesin build yang berganti tiap build, jadi
# tiap update ditolak Android dan wajib uninstall dulu.
#
# Cache (ditambah 2026-11-14 atas permintaan Adnan supaya build lebih
# cepat): pub-cache + gradle disimpan antar-build, jadi build berikutnya
# tidak mengunduh ulang dari nol. Build PERTAMA sesudah cache aktif
# tetap lambat (mengisi cache); kecepatannya terasa mulai build kedua.
workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/Library/Caches/CocoaPods
    environment:
      flutter: 3.47.9
      # Grup variable AVOERA WAJIB diimpor: AVOERA_UPLOAD_TOKEN
      # disimpan Adnan di dalam grup itu (2026-11-15). Tanpa
      # impor ini variable-nya KOSONG saat build — kejadian
      # 2026-11-15 22:56: token sudah diisi sebelum build tapi
      # langkah unggah terlewati diam-diam karena grup belum
      # diimpor, server tetap berisi versi lama.
      groups:
        - AVOERA
      android_signing:
        - avoera_release
    scripts:
      - name: Cek versi Java
        script: java -version
      - name: Ambil dependencies
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
      # Pembaruan dalam aplikasi (v0.10.7): unggah APK jadi ke
      # server supaya aplikasi yang terpasang bisa mengecek,
      # mengunduh, dan menawarkannya sendiri. Butuh SATU variable
      # di Codemagic (App settings > Environment variables):
      # AVOERA_UPLOAD_TOKEN. Belum diatur -> langkah ini dilewati
      # dengan aman, build tetap berhasil.
      - name: Unggah APK untuk pembaruan dalam aplikasi
        script: |
          if [ -z "$AVOERA_UPLOAD_TOKEN" ]; then
            echo "AVOERA_UPLOAD_TOKEN belum diatur — unggah dilewati."
            exit 0
          fi
          APK=$(ls build/app/outputs/flutter-apk/app-release.apk)
          KODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          NAMA=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | sed 's/+.*//')
          CATATAN=$(git log -1 --pretty=%s | tr -cd '[:print:]' | cut -c1-200)
          curl -f -X POST "https://webtales.my.id/avoera/upload" \
            -H "X-Upload-Token: $AVOERA_UPLOAD_TOKEN" \
            -H "X-Version-Code: $KODE" \
            -H "X-Version-Name: $NAMA" \
            -H "X-Notes: $CATATAN" \
            --data-binary @"$APK"
          echo "APK v$NAMA (build $KODE) terunggah untuk pembaruan dalam aplikasi."
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  android-debug:
    name: Android Debug
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/Library/Caches/CocoaPods
    environment:
      flutter: 3.47.9
    scripts:
      - name: Cek versi Java
        script: java -version
      - name: Ambil dependencies
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
