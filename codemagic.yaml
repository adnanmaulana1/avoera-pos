# Codemagic CI untuk Avoera POS (Android).
#
# Dua workflow, KEDUANYA manual (tidak ada trigger otomatis) supaya tidak ada
# build yang jalan tanpa disadari:
#   - android-release : flutter pub get + flutter build apk --release --split-per-abi
#   - android-debug   : flutter pub get + flutter build apk --debug
#
# Split per ABI (sejak v0.10.13, permintaan Adnan: unduhan
# pembaruan 61 MB terlalu lambat): rilis menghasilkan tiga APK
# (arm64-v8a / armeabi-v7a / x86_64, masing-masing ±25 MB).
# Yang diterbitkan ke avoera-releases: arm64 sebagai avoera.apk
# + arm32 sebagai avoera-32.apk; aplikasi memilih sendiri.
# Catatan: Flutter memberi kode versi per ABI (1000×build +
# penanda ABI) — perbandingan versi aplikasi memakai konstanta
# appBuild di data.dart, jadi skema itu tidak mengganggu.
#
# Project Flutter ada di ROOT repo ini (bukan subfolder mobile/),
# jadi artifacts ada di build/app/outputs/flutter-apk/*.apk.
#
# Mesin mac_mini_m2 mengikuti pola WeLaundry: build memakai kuota gratis
# Codemagic 500 menit macOS/bulan.
#
# Keystore rilis TETAP (sejak 2026-11-15): referensi avoera_release,
# diunggah sekali ke Codemagic (Team settings > codemagic.yaml settings
# > Code signing identities > Android keystores). build.gradle.kts
# membaca CM_KEYSTORE_* sehingga SEMUA build bertanda tangan sama ->
# update berikutnya bisa langsung ditimpa TANPA uninstall. Sebelumnya
# APK memakai kunci debug mesin build yang berganti tiap build, jadi
# tiap update ditolak Android dan wajib uninstall dulu.
#
# Cache (ditambah 2026-11-14 atas permintaan Adnan supaya build lebih
# cepat): pub-cache + gradle disimpan antar-build, jadi build berikutnya
# tidak mengunduh ulang dari nol. Build PERTAMA sesudah cache aktif
# tetap lambat (mengisi cache); kecepatannya terasa mulai build kedua.
workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/Library/Caches/CocoaPods
    environment:
      flutter: 3.47.9
      android_signing:
        - avoera_release
    scripts:
      - name: Cek versi Java
        script: java -version
      - name: Ambil dependencies
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release --split-per-abi
      # Pembaruan dalam aplikasi: sejak v0.10.10 TIDAK ada lagi
      # langkah unggah di sini. Berkas pembaruan (version.json +
      # APK) diterbitkan Muse ke repo GitHub publik
      # avoera-releases sesudah build selesai — keputusan Adnan
      # 2026-11-15: jangan pakai server miliknya (sering kena
      # suspend). Langkah unggah lama ke webtales.my.id dicabut.
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  android-debug:
    name: Android Debug
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/Library/Caches/CocoaPods
    environment:
      flutter: 3.47.9
    scripts:
      - name: Cek versi Java
        script: java -version
      - name: Ambil dependencies
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
